		<style>
			/* Make the section a column layout so header + iframe stack */
			#plot-slide {
			display: flex;
			flex-direction: column;
			height: 100%;
			box-sizing: border-box;
			}

			/* make header compact: fixed height, remove h2 margins */
			.slide-header{
			display:flex;
			justify-content:space-between;
			align-items: center;
			height: 72px;            /* reserve fixed header height */
			min-height: 56px;
			flex: 0 0 72px;         /* do not stretch */
			padding: 0 0.4rem;
			
			box-sizing: border-box;
			}

			/* tighten h2 so it doesn't push layout */
			.slide-header h2{
			margin: 0;
			font-size: 2.2rem;      /* reduce if too large */
			line-height: 1;
			}

			/* iframe wrapper fills the remaining space */
			.iframe-wrap {
			flex: 1 1 auto;         /* take the remaining vertical space */
			display: flex;
			justify-content: center;
			width: 100%;
			box-sizing: border-box;
			overflow: hidden;
			padding-top: 0.5rem;
			height: 100%;
			}

			/* iframe itself fills wrapper exactly */
			#plot-iframe {
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 6px;
			display: block;
			background: #FFFFFF;
			}
			</style>



		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
		
			const isMobile = /(iphone|ipod|ipad|android)/gi.test( navigator.userAgent ) ||
				( navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 ); // iPadOS
				
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: false,
				transition: 'none',
				backgroundTransition: 'none',	
				progress: false,	
				autoPlayMedia: false,	
				controls: isMobile,
				controlsLayout: 'edges',
				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});

			
		</script>
		<script>

			// parent: post init only when slide is visible and wrapper non-zero
		const iframe = document.getElementById('plot-iframe');
		const wrapper = document.querySelector('.iframe-wrap') || iframe;

		function postInitIfReady() {
		const r = wrapper.getBoundingClientRect();
		if (r.width > 0 && r.height > 0) {
			iframe.contentWindow.postMessage({ action:'init', width:Math.floor(r.width), height:Math.floor(r.height) }, '*');
			console.log('parent: posted init', {w:r.width,h:r.height});
			return true;
		}
		console.log('parent: wrapper still zero, skipping init', {w:r.width,h:r.height});
		return false;
		}

		// call when reveal slidechanged to this slide
		Reveal.on('slidechanged', ev => {
		if (ev.currentSlide && ev.currentSlide.querySelector && ev.currentSlide.querySelector('#plot-iframe')) {
			// try immediately; if wrapper 0, try again on next animation frame (small loop)
			if (!postInitIfReady()) {
			// small poll loop — will try a few times
			let tries = 6;
			(function poll() {
				const r = wrapper.getBoundingClientRect();
				if (r.width > 0 && r.height > 0) { postInitIfReady(); return; }
				if (--tries <= 0) { console.warn('parent: init aborted — wrapper stayed zero'); return; }
				requestAnimationFrame(() => setTimeout(poll, 80));
			})();
			}
		}
		});

		
  
		  
	
		</script>
			
	
			<script src="js/video_slide.js"></script>
		</body>
