		<script>

// Parent: initialize ALL iframes with id="plot-iframe" (minimal)
(function(){
  const now = () => (performance.now()/1000).toFixed(3);

  // returns NodeList of all iframes that match the id (works even with duplicates)
  function getAllPlotIframes() {
    return Array.from(document.querySelectorAll('#plot-iframe'));
  }

  // Try to post init to one iframe when its wrapper has non-zero size.
  function postInitForOne(iframe, maxTries = 6, delay = 80) {
    if (!iframe || iframe.dataset.plotInited === 'true') {
      return Promise.resolve(false);
    }

    const wrapper = iframe.closest('.iframe-wrap') || iframe.parentElement || iframe;
    function measure() {
      const r = wrapper.getBoundingClientRect();
      return { w: Math.floor(r.width), h: Math.floor(r.height) };
    }

    return new Promise(resolve => {
      let tries = maxTries;
      (function attempt() {
        const { w, h } = measure();
        if (w > 0 && h > 0) {
          iframe.contentWindow.postMessage({ action: 'init', width: w, height: h, ts: Date.now() }, '*');
          iframe.dataset.plotInited = 'true';
          console.log(`[PARENT ${now()}] posted init ->`, iframe, { w, h });
          resolve(true);
          return;
        }
        if (--tries <= 0) {
          console.warn(`[PARENT ${now()}] wrapper stayed zero, giving up for`, iframe, { w, h });
          resolve(false);
          return;
        }
        // try again next tick
        requestAnimationFrame(() => setTimeout(attempt, delay));
      })();
    });
  }

  // Handler for slidechanged: init all plot-iframes present in the shown slide
  function onSlideChanged(ev) {
    const slide = (ev && ev.currentSlide) || document.querySelector('.reveal .slides section.present');
    if (!slide) return;
    // find iframes in this slide that have id="plot-iframe"
    const iframes = Array.from(slide.querySelectorAll('#plot-iframe'));
    iframes.forEach(iframe => {
      // try initializing (each iframe polled independently)
      postInitForOne(iframe).then(posted => {
        if (!posted) {
          console.log(`[PARENT ${now()}] init not posted for`, iframe);
        }
      });
    });
  }

  // Hook into Reveal
  if (window.Reveal && typeof Reveal.on === 'function') {
    Reveal.on('slidechanged', onSlideChanged);
    Reveal.on('ready', (ev) => onSlideChanged({ currentSlide: ev.currentSlide }));
    // If Reveal already initialized, call once
    if (Reveal.getCurrentSlide) onSlideChanged({ currentSlide: Reveal.getCurrentSlide() });
  } else {
    // fallback: try on load
    window.addEventListener('load', () => {
      onSlideChanged({ currentSlide: document.querySelector('.reveal .slides section.present') });
    });
  }

  // manual helper for debugging from parent console:
  window.initAllPlotIframesNow = () => {
    getAllPlotIframes().forEach(iframe => postInitForOne(iframe, 10, 50));
    console.log(`[PARENT ${now()}] manual init triggered`);
  };

  console.log(`[PARENT ${now()}] plot-iframe multi-initializer installed`);
})();
